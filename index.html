.grocery-toolbar, .grocery-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.grocery-totals .grocery-spend { margin-left: auto; text-align: right; }
.grocery-spend small { display: block; color: #617657; font-size: 11px; }
.grocery-totals .grocery-spend strong { font-size: 20px; }
.grocery-add { margin: 0 0 16px; }
.grocery-add input { font-size: 14px; }
.shopping-item { border-top: 1px solid #eff1e9; padding: 4px 0 8px; }
.shopping-row { display: flex; align-items: center; gap: 8px; }
.shopping-check { display: flex; flex: 1; min-width: 0; min-height: 44px; align-items: center; gap: 9px; cursor: pointer; }
.shopping-check input { margin: 0; flex-shrink: 0; accent-color: #436a43; }
.shopping-name { flex: 1; overflow-wrap: anywhere; font-size: 13px; }
.shopping-quantity { color: #617657; font-size: 11px; text-align: right; }
.shopping-done .shopping-name { text-decoration: line-through; color: #617657; }
.shopping-details { margin: 0 0 0 27px; color: #617657; font-size: 11px; }
.shopping-details summary { cursor: pointer; width: fit-content; }
.shopping-details p { margin: 5px 0; }
.shopping-options { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.shopping-options select { margin-left: 4px; }
.grocery-price-form { padding: 0 20px 20px; }
.grocery-price-form label { display: grid; gap: 7px; margin-bottom: 14px; }
.grocery-price-form input { width: 100%; font-size: 16px; }
.grocery-price-form p { color: #a23e32; margin-bottom: 12px; }

.calendar-grocery-total { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; color: #476247; background: #f3f5ec; font-size: 13px; }
.calendar-grocery-total .text-btn { margin-left: auto; }
.grocery-finish { display: flex; justify-content: flex-end; margin-top: 18px; }
.grocery-checked { grid-column: 1 / -1; background: #f5f6ef; padding: 12px 16px; }
.grocery-flat .grocery-checked:not(:first-child) { margin-top: 14px; }
.grocery-checked h2 { font-size: 13px; margin-bottom: 4px; }
.checked-items { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); column-gap: 16px; }
.checked-items .shopping-item { padding: 0; border-color: var(--line); }
.checked-items .shopping-name { font-size: 12px; }
</style>
